<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F97316">
  <title>Sin conexión | FitGrowX</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #0A0A0A 0%, #1a1a2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .container {
      text-align: center;
      padding: 24px;
      max-width: 400px;
      margin: auto;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .info-box {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    .info-box strong {
      color: #F97316;
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .info-box ul {
      list-style: none;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
    }

    .info-box li {
      padding: 4px 0;
    }

    .signal-bars {
      display: inline-flex;
      gap: 4px;
      margin-bottom: 24px;
    }

    .bar {
      width: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      animation: wave 1.2s infinite;
    }

    .bar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .bar:nth-child(2) { height: 12px; animation-delay: 0.2s; }
    .bar:nth-child(3) { height: 16px; animation-delay: 0.4s; }

    @keyframes wave {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .button {
      display: inline-block;
      padding: 12px 28px;
      background: #F97316;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      margin-top: 12px;
    }

    .button:hover {
      background: #E65A00;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(249, 115, 22, 0.3);
    }

    .button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>

    <h1>Sin conexión</h1>
    <p>Parece que perdiste conexión a internet.</p>

    <div class="signal-bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="info-box">
      <strong>Puedes:</strong>
      <ul>
        <li>✓ Ver tus clases si las cargaste antes</li>
        <li>✓ Revisar tu membresía</li>
        <li>✗ Hacer pagos o cambios</li>
      </ul>
    </div>

    <p style="font-size: 13px; margin-bottom: 24px;">
      La app intentará reconectarse automáticamente cuando recuperes la conexión.
    </p>

    <button class="button" onclick="location.reload()">
      Reintentar ahora
    </button>
  </div>

  <script>
    window.addEventListener("online", () => {
      location.reload();
    });
  </script>
</body>
</html>
